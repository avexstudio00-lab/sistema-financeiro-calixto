# Item 9 da apuração de segurança: o GitHub abre sozinho um pull request
# quando sair correção de segurança/versão nova de uma dependência.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    groups:
      correcoes:
        update-types: [minor, patch]
    ignore:
      # Next 15 e React 19 são trocas de versão grandes (quebram código):
      # ficam para uma migração planejada, não para um PR automático.
      - dependency-name: next
        update-types: ["version-update:semver-major"]
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
