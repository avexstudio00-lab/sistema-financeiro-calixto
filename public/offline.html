<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Você está offline — Meu Controle</title>
<style>
  :root {
    --background: 248 250 252;
    --foreground: 15 23 42;
    --card: 255 255 255;
    --border: 226 232 240;
    --muted: 100 116 139;
    --primary: 16 185 129;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --background: 8 11 21;
      --foreground: 241 245 249;
      --card: 17 22 35;
      --border: 32 39 55;
      --muted: 148 163 184;
      --primary: 52 211 153;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: rgb(var(--background));
    color: rgb(var(--foreground));
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Roboto, sans-serif;
    text-align: center;
  }
  .card {
    max-width: 380px;
    width: 100%;
    background: rgb(var(--card));
    border: 1px solid rgb(var(--border));
    border-radius: 28px;
    padding: 40px 28px 32px;
    box-shadow: 0 4px 20px -4px rgb(15 23 42 / 0.08);
  }
  .icone {
    width: 72px;
    height: 72px;
    margin: 0 auto 20px;
    border-radius: 20px;
    background: rgb(var(--primary) / 0.12);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  h1 {
    font-size: 1.375rem;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0 0 10px;
  }
  p {
    font-size: 0.9375rem;
    line-height: 1.6;
    color: rgb(var(--muted));
    margin: 0 0 24px;
  }
  button {
    appearance: none;
    border: none;
    width: 100%;
    padding: 13px 20px;
    border-radius: 14px;
    background: rgb(var(--primary));
    color: #ffffff;
    font-size: 0.9375rem;
    font-weight: 600;
    cursor: pointer;
  }
  button:active {
    opacity: 0.85;
  }
  .rodape {
    margin-top: 18px;
    font-size: 0.75rem;
    color: rgb(var(--muted) / 0.8);
  }
  .status {
    margin-top: 14px;
    font-size: 0.8125rem;
    color: rgb(var(--primary));
    min-height: 1.2em;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icone" aria-hidden="true">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="rgb(16 185 129)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h1>Você está offline</h1>
    <p>
      Sem conexão com a internet no momento. Assim que ela voltar, o Meu
      Controle volta ao normal sozinho — não precisa fazer nada.
    </p>
    <button onclick="location.reload()">Tentar novamente</button>
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <p class="rodape">Meu Controle</p>
  </div>
  <script>
    (function () {
      var statusEl = document.getElementById("status");
      var tentando = false;

      function voltouDeVerdade() {
        // navigator.onLine só diz que tem rede local, não que a internet
        // funciona de fato -- por isso confirma com uma requisição real,
        // pequena e sem cache, antes de recarregar a página sozinho.
        if (tentando) return;
        tentando = true;
        fetch("/manifest.json", { cache: "no-store" })
          .then(function () {
            if (statusEl) statusEl.textContent = "Conexão de volta, atualizando...";
            location.reload();
          })
          .catch(function () {
            tentando = false;
          });
      }

      window.addEventListener("online", voltouDeVerdade);
      setInterval(voltouDeVerdade, 4000);
    })();
  </script>
</body>
</html>
